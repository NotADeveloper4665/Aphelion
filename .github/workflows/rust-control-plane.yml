name: Rust control-plane prototype

on:
  push:
    branches:
      - prototype/rust-control-plane
  pull_request:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo build --workspace 
      - name: Run tests
        run: cargo test --workspace
      - name: Run supervisor-worker IPC smoke test
        run: ./target/debug/supervisor
      - name: Verify restart after an injected worker crash
        shell: bash
        run: |
          set -euo pipefail
          output="$(APHELION_TEST_CRASH_FIRST_WORKER=1 ./target/debug/supervisor 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          grep -Fq "injected failure during host.start" <<<"$output"
          grep -Fq "retry 1/3" <<<"$output"
          grep -Fq "starting worker generation 2" <<<"$output"
          grep -Fq "start_host =>" <<<"$output"
          grep -Fq "stop_host =>" <<<"$output"
          grep -Fq "worker generation 2 exited with exit status: 0" <<<"$output"

      - name: Verify Syzygy process adapter with a stub binary
        shell: bash
        run: |
          set -euo pipefail
          stub="$RUNNER_TEMP/syzygy-stub"
          arg_log="$RUNNER_TEMP/syzygy-args"
          cat > "$stub" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SYZYGY_MANAGED_CHILD" "$@" > "$APHELION_TEST_ARG_LOG"
          printf '%s\n' "SYZYGY_SESSION_START 0xabc hevc"
          trap 'printf "%s\n" "SYZYGY_SESSION_STOP 0xabc"; exit 0' TERM
          while :; do sleep 60 & wait $!; done
          EOF
          chmod +x "$stub"
          output="$(APHELION_WORKER_KIND=syzygy APHELION_SYZYGY_EXECUTABLE="$stub" APHELION_TEST_ARG_LOG="$arg_log" ./target/debug/supervisor 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          grep -Fq '"state":"process_started"' <<<"$output"
          grep -Fq '"process_running":true' <<<"$output"
          grep -Fq '"client_session_count":1' <<<"$output"
          grep -Fq '"state":"stopped"' <<<"$output"
          ! grep -Fq '0xabc' <<<"$output"
          grep -Fxq "1" "$arg_log"
          grep -Fxq -- "-s" "$arg_log"
          grep -Fxq -- "-foreground" "$arg_log"

      - name: Recover from a Syzygy startup crash
        shell: bash
        run: |
          set -euo pipefail
          stub="$RUNNER_TEMP/syzygy-crash-stub"
          marker="$RUNNER_TEMP/syzygy-crash-once"
          cat > "$stub" <<'EOF'
          #!/bin/sh
          if [ ! -e "$APHELION_TEST_CRASH_MARKER" ]; then
            touch "$APHELION_TEST_CRASH_MARKER"
            exit 42
          fi
          exec sleep 60
          EOF
          chmod +x "$stub"
          output="$(APHELION_WORKER_KIND=syzygy APHELION_SYZYGY_EXECUTABLE="$stub" APHELION_TEST_CRASH_MARKER="$marker" ./target/debug/supervisor 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          test -e "$marker"
          grep -Fq "Syzygy exited during launch" <<<"$output"
          grep -Fq "retry 1/3" <<<"$output"
          grep -Fq "starting worker generation 2" <<<"$output"
          grep -Fq '"state":"process_started"' <<<"$output"
          grep -Fq '"process_running":true' <<<"$output"
          grep -Fq "worker generation 2 exited with exit status: 0" <<<"$output"
