name: Rust control-plane prototype

on:
  push:
    branches:
      - prototype/rust-control-plane
  pull_request:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo build --workspace 
      - name: Run tests
        run: cargo test --workspace
      - name: Run supervisor-worker IPC smoke test
        run: ./target/debug/supervisor
      - name: Verify restart after an injected worker crash
        shell: bash
        run: |
          set -euo pipefail
          output="$(APHELION_TEST_CRASH_FIRST_WORKER=1 ./target/debug/supervisor 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          grep -Fq "injected failure during host.start" <<<"$output"
          grep -Fq "retry 1/3" <<<"$output"
          grep -Fq "starting worker generation 2" <<<"$output"
          grep -Fq "start_host =>" <<<"$output"
          grep -Fq "stop_host =>" <<<"$output"
          grep -Fq "worker generation 2 exited with exit status: 0" <<<"$output"

      - name: Verify Syzygy process adapter with a stub binary
        shell: bash
        run: |
          set -euo pipefail
          stub="$RUNNER_TEMP/syzygy-stub"
          arg_log="$RUNNER_TEMP/syzygy-args"
          cat > "$stub" <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = "-stop" ]; then exit 0; fi
          printf '%s\n' "$SYZYGY_MANAGED_CHILD" "$@" > "$APHELION_TEST_ARG_LOG"
          printf '%s\n' "SYZYGY_SESSION_START 0xabc hevc"
          trap 'printf "%s\n" "SYZYGY_SESSION_STOP 0xabc"; exit 0' TERM
          while :; do sleep 60 & wait $!; done
          EOF
          chmod +x "$stub"
          output="$(APHELION_WORKER_KIND=syzygy APHELION_SYZYGY_EXECUTABLE="$stub" APHELION_TEST_ARG_LOG="$arg_log" ./target/debug/supervisor 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          grep -Fq '"state":"process_started"' <<<"$output"
          grep -Fq '"process_running":true' <<<"$output"
          grep -Fq '"client_session_count":1' <<<"$output"
          grep -Fq 'observed worker event Started' <<<"$output"
          grep -Fq 'observed worker event Stopped' <<<"$output"
          grep -Fq '"state":"stopped"' <<<"$output"
          ! grep -Fq '0xabc' <<<"$output"
          grep -Fxq "1" "$arg_log"
          grep -Fxq -- "-s" "$arg_log"
          grep -Fxq -- "-foreground" "$arg_log"

      - name: Refuse a duplicate running Syzygy host
        shell: bash
        run: |
          set -euo pipefail
          stub="$RUNNER_TEMP/syzygy-duplicate-stub"
          launch_marker="$RUNNER_TEMP/syzygy-duplicate-launched"
          cat > "$stub" <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = "-stop" ]; then exit 0; fi
          touch "$APHELION_TEST_LAUNCH_MARKER"
          exec sleep 60
          EOF
          chmod +x "$stub"
          python3 - <<'PY' &
          import ctypes
          import time
          libc = ctypes.CDLL(None)
          if libc.prctl(15, ctypes.c_char_p(b"syzygy"), 0, 0, 0) != 0:
              raise OSError("prctl(PR_SET_NAME) failed")
          time.sleep(60)
          PY
          existing_pid=$!
          cleanup() {
            kill "$existing_pid" 2>/dev/null || true
            wait "$existing_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 0.2
          set +e
          output="$(APHELION_WORKER_KIND=syzygy \
            APHELION_SYZYGY_EXECUTABLE="$stub" \
            APHELION_TEST_LAUNCH_MARKER="$launch_marker" \
            ./target/debug/supervisor 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'a separate Syzygy host process is still running' <<<"$output"
          test ! -e "$launch_marker"

      - name: Recover from a Syzygy startup crash
        shell: bash
        run: |
          set -euo pipefail
          stub="$RUNNER_TEMP/syzygy-crash-stub"
          marker="$RUNNER_TEMP/syzygy-crash-once"
          cat > "$stub" <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = "-stop" ]; then exit 0; fi
          if [ ! -e "$APHELION_TEST_CRASH_MARKER" ]; then
            touch "$APHELION_TEST_CRASH_MARKER"
            exit 42
          fi
          exec sleep 60
          EOF
          chmod +x "$stub"
          output="$(APHELION_WORKER_KIND=syzygy APHELION_SYZYGY_EXECUTABLE="$stub" APHELION_TEST_CRASH_MARKER="$marker" ./target/debug/supervisor 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          test -e "$marker"
          grep -Fq "Syzygy exited during launch" <<<"$output"
          grep -Fq "retry 1/3" <<<"$output"
          grep -Fq "starting worker generation 2" <<<"$output"
          grep -Fq '"state":"process_started"' <<<"$output"
          grep -Fq '"process_running":true' <<<"$output"
          grep -Fq "worker generation 2 exited with exit status: 0" <<<"$output"

      - name: Verify persistent host mode and graceful shutdown
        shell: bash
        run: |
          set -euo pipefail
          stub="$RUNNER_TEMP/syzygy-serve-stub"
          output_file="$RUNNER_TEMP/aphelion-serve-output"
          stop_marker="$RUNNER_TEMP/syzygy-serve-stop-marker"
          stop_command_log="$RUNNER_TEMP/syzygy-stop-command-log"
          cat > "$stub" <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = "-stop" ]; then
            printf '%s\n' called >> "$APHELION_TEST_STOP_COMMAND_LOG"
            printf '%s\n' 'Syzygy: already stopped'
            exit 0
          fi
          printf '%s\n' "SYZYGY_SESSION_START client-token hevc"
          trap 'touch "$APHELION_TEST_STOP_MARKER"; printf "%s\n" "SYZYGY_SESSION_STOP client-token"; exit 0' TERM
          while :; do sleep 60 & wait $!; done
          EOF
          chmod +x "$stub"
          APHELION_WORKER_KIND=syzygy \
            APHELION_SYZYGY_EXECUTABLE="$stub" \
            APHELION_TEST_STOP_MARKER="$stop_marker" \
            APHELION_TEST_STOP_COMMAND_LOG="$stop_command_log" \
            ./target/debug/supervisor --serve >"$output_file" 2>&1 &
          supervisor_pid=$!
          cleanup() {
            kill -TERM "$supervisor_pid" 2>/dev/null || true
            wait "$supervisor_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 100); do
            if grep -Fq 'host is running; connect with a Moonlight client' "$output_file"; then
              break
            fi
            if ! kill -0 "$supervisor_pid" 2>/dev/null; then
              cat "$output_file"
              exit 1
            fi
            sleep 0.1
          done
          grep -Fq 'host is running; connect with a Moonlight client' "$output_file" || {
            cat "$output_file"
            exit 1
          }
          for attempt in $(seq 1 100); do
            if grep -Fq 'health =>' "$output_file"; then
              break
            fi
            sleep 0.1
          done
          grep -Fq 'health =>' "$output_file" || {
            cat "$output_file"
            exit 1
          }
          kill -TERM "$supervisor_pid"
          wait "$supervisor_pid"
          trap - EXIT
          cat "$output_file"
          grep -Fq 'received SIGTERM; stopping host' "$output_file"
          grep -Fq 'stop_host =>' "$output_file"
          grep -Fq 'shutdown acknowledged; waiting for child exit' "$output_file"
          grep -Fq 'worker generation 1 exited with exit status: 0' "$output_file"
          test -e "$stop_marker"
          test "$(wc -l < "$stop_command_log")" -ge 3
          grep -Fq 'observed worker event Started' "$output_file"
          grep -Fq 'observed worker event Stopped' "$output_file"
          ! grep -Fq 'client-token' "$output_file"

      - name: Build installable Linux prototype bundle
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --workspace
          bundle="$RUNNER_TEMP/aphelion-linux-x86_64"
          mkdir -p "$bundle/bin"
          install -m 0755 target/release/supervisor "$bundle/bin/supervisor"
          install -m 0755 target/release/syzygy-worker "$bundle/bin/syzygy-worker"
          install -m 0755 packaging/aphelion-syzygy "$bundle/bin/aphelion-syzygy"
          install -m 0644 docs/PROTOTYPE-RUNTIME-TEST.md "$bundle/README.md"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/aphelion-linux-x86_64.tar.gz" aphelion-linux-x86_64

      - name: Upload installable Linux prototype bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: aphelion-linux-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/aphelion-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
