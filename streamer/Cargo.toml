[package]
name = "aphelion-streamer"
version = "0.1.0"
edition = "2021"

[lib]
name = "aphelion_streamer"
path = "src/lib.rs"

[dependencies]
aes = "=0.8.4"
aes-gcm = "=0.11.1"
rand = "=0.8.5"
rsa = { version = "=0.9.8", features = ["sha2"] }
subtle = "=2.6.1"
x509-parser = "=0.17.0"
reed-solomon-erasure = "=6.0.0"
sha2 = "=0.10.9"
zeroize = "=1.8.2"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
